[package]
name = "scholargate"
version = "1.0.4"
description = "Native Desktop App & Localhost Gateway for Academic Research"
authors = ["Phong Dang"]
edition = "2021"


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
async-stream = "0.3"
md5 = "0.7"
sha2 = "0.10"
urlencoding = "2.1"
quick-xml = "0.42"
regex = "1"
toml_edit = "0.25"
rfd = { version = "0.15", features = ["common-controls-v6"] }

keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# Desktop builds ship this binary to users, so trade compile time for size and
# speed. `panic = "abort"` is deliberately left off: the gateway catches panics
# per request rather than taking the whole app down with it.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
